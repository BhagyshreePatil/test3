<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
        }

        .container {
            width: 390px;
            min-height: 277px;
            margin: 60px auto;
            padding: 18px;
            background: linear-gradient(135deg, #7020d0, #2176f5);
        }

        .success-card {
            background: white;
            min-height: 241px;
            border-radius: 8px;
            padding: 35px 30px 25px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .party-icon {
            font-size: 28px;
            margin-bottom: 2px;
        }

        h1 {
            margin: 0 0 18px;
            color: #333;
            font-size: 24px;
            line-height: 1.35;
        }

        p {
            font-size: 12px;
            color: #555;
            margin: 8px 0;
        }

        strong {
            color: #333;
        }

        button {
            width: 175px;
            height: 32px;
            margin-top: 17px;
            border: none;
            border-radius: 5px;
            background: #7412d1;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #5f0fb0;
        }

        @media (max-width: 500px) {

            .container {
                width: 90%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="success-card">

            <div class="party-icon">🎉</div>

            <h1>
                Registration<br>
                Successful!
            </h1>

            <p>
                Thank you,
                <strong>{{ full_name }}</strong>!
            </p>

            <p>
                You have been registered for
                <strong>{{ event }}</strong>.
            </p>

            <button onclick="window.location.href='/'">
                Register another attendee
            </button>

        </div>

    </div>

</body>

</html>
